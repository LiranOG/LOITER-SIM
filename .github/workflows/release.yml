name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha"
      - "v[0-9]+.[0-9]+.[0-9]+-beta"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0-alpha)"
        required: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Validate: run full CI before releasing
  # ─────────────────────────────────────────────────────────────────
  validate:
    name: Pre-release Validation
    uses: ./.github/workflows/ci.yml

  # ─────────────────────────────────────────────────────────────────
  # Build release artifacts
  # ─────────────────────────────────────────────────────────────────
  build-release:
    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      matrix:
        include:
          - name: linux-x86_64-gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            artifact: loiter-sim-linux-x86_64

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ${{ matrix.cc }} cmake ninja-build \
            libhdf5-dev libyaml-cpp-dev libeigen3-dev \
            python3-dev

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Configure
        run: |
          cmake -B build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dist \
            -DLOITER_SIM_VERSION="${{ steps.version.outputs.version }}" \
            -DLOITER_SIM_BUILD_TESTS=OFF \
            -DLOITER_SIM_BUILD_PYTHON=ON

      - name: Build
        run: cmake --build build-release --parallel $(nproc)

      - name: Install to dist/
        run: cmake --install build-release

      - name: Package
        run: |
          tar -czf ${{ matrix.artifact }}-${{ steps.version.outputs.version }}.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-*.tar.gz

  # ─────────────────────────────────────────────────────────────────
  # Build Python wheels
  # ─────────────────────────────────────────────────────────────────
  python-wheels:
    name: Python Wheels (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    needs: validate
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build \
            libhdf5-dev libyaml-cpp-dev libeigen3-dev
          pip install build wheel

      - name: Build wheel
        env:
          CC: gcc-13
          CXX: g++-13
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python }}
          path: dist/*.whl

  # ─────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-release, python-wheels]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          python3 -c "
          import re, sys
          text = open('CHANGELOG.md').read()
          # Match section for this version
          pattern = r'## \[' + re.escape(VERSION.lstrip('v')) + r'\].*?(?=## \[|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          print(match.group(0).strip() if match else 'See CHANGELOG.md for details.')
          " > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: LOITER-SIM ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.whl
