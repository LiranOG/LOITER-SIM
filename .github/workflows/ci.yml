name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'core/**'
      - 'bindings/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'core/**'
      - 'bindings/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'

# No code yet — CI activates automatically once core/ or bindings/ have content.
# See ROADMAP.md: M1 Foundation targets Q4 2026.

jobs:
  ci-gate:
    name: CI / CI Gate
    runs-on: ubuntu-22.04
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for compilable code
        id: check
        run: |
          if find core -name '*.cpp' | grep -q .; then
            echo "has_code=true" >> $GITHUB_OUTPUT
          else
            echo "has_code=false" >> $GITHUB_OUTPUT
            echo "No C++ source files found yet. Skipping build steps."
            echo "This is expected during the design phase (pre-M1)."
          fi

  build-and-test:
    name: CI / Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    needs: ci-gate
    if: needs.ci-gate.outputs.has_code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-16
            cxx: clang++-16
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libhdf5-dev libyaml-cpp-dev libeigen3-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  format-lint:
    name: CI / Format & Lint
    needs: ci-gate
    if: needs.ci-gate.outputs.has_code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-17 clang-tidy-17
      - name: Check formatting
        run: |
          find core bindings tests -name '*.cpp' -o -name '*.hpp' | \
          xargs clang-format-17 --dry-run --Werror
      - name: Run clang-tidy
        run: |
          find core -name '*.cpp' | \
          xargs clang-tidy-17 --warnings-as-errors='*'

  sanitizers:
    name: CI / Sanitizers (ASan + UBSan)
    needs: ci-gate
    if: needs.ci-gate.outputs.has_code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libhdf5-dev libyaml-cpp-dev libeigen3-dev
      - name: Configure with sanitizers
        env:
          CC: clang-16
          CXX: clang++-16
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  python-bindings:
    name: CI / Python Bindings (Python ${{ matrix.python-version }})
    needs: ci-gate
    if: needs.ci-gate.outputs.has_code == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libhdf5-dev libyaml-cpp-dev libeigen3-dev
      - name: Build and install Python package
        run: pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest tests/python/ -v

  determinism-regression:
    name: CI / Determinism Regression
    needs: [ci-gate, build-and-test]
    if: needs.ci-gate.outputs.has_code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libhdf5-dev libyaml-cpp-dev libeigen3-dev
      - name: Build
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Run determinism test (run 1)
        run: ./build/loiter_sim_tests --gtest_filter="Determinism*" --output-hash=/tmp/hash1.txt
      - name: Run determinism test (run 2)
        run: ./build/loiter_sim_tests --gtest_filter="Determinism*" --output-hash=/tmp/hash2.txt
      - name: Assert bitwise identity
        run: diff /tmp/hash1.txt /tmp/hash2.txt && echo "DETERMINISM OK"
