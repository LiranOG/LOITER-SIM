name: Sync GitHub Labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/labels.yml'
    branches: [main]

jobs:
  sync-labels:
    name: Sync Labels
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Sync labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
