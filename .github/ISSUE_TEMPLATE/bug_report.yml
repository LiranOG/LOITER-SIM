name: Bug Report
description: Report a reproducible bug in LOITER-SIM
title: "[BUG] "
labels: ["bug", "triage"]
assignees: ["LiranOG"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing a bug report. Please fill in all sections below.
        **Do not use this form for security vulnerabilities** — see `SECURITY.md` instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: |
        The smallest possible code or scenario file that reproduces the issue.
        If a YAML scenario or HDF5 file triggers the issue, attach it below.
      placeholder: |
        ```cpp
        // Minimal reproduction case
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include full error output, assertion failures, or log excerpts.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "ECS World"
        - "6-DOF Dynamics"
        - "AMR Solver"
        - "Aerodynamics"
        - "Sensor: Radar"
        - "Sensor: EO/IR"
        - "Sensor: INS/GPS"
        - "Electronic Warfare"
        - "Communications / Mesh Network"
        - "Python Bindings / Gymnasium API"
        - "YAML Scenario Loader"
        - "HDF5 Persistence"
        - "Determinism / PRNG"
        - "Build System / CMake"
        - "CI / GitHub Actions"
        - "Documentation"
        - "Unknown"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — simulation produces wrong physics / determinism broken"
        - "High — major feature broken, no workaround"
        - "Medium — feature degraded, workaround exists"
        - "Low — minor inconvenience"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide:
        - OS and version
        - Compiler and version (e.g., GCC 13.2, Clang 17)
        - CMake version
        - Python version (if using bindings)
        - CPU architecture (x86_64 / ARM64 / other)
        - Build type (Release / Debug / RelWithDebInfo)
      placeholder: |
        OS: Ubuntu 24.04
        Compiler: GCC 13.2
        CMake: 3.28
        Python: 3.11.6
        CPU: x86_64 (Intel Core i9-13900K)
        Build type: Release
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am using the latest commit on `main`
          required: true
        - label: This is not a security vulnerability (I would use the private advisory process instead)
          required: true
